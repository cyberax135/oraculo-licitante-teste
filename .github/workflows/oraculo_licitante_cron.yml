name: Oráculo Licitante (Produção)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  motor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary
          
      - name: Executar Motor (Bulk-fetch + Envio Wappfly)
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL_RW }}
          WAPPFLY_TOKEN: ${{ secrets.WAPPFLY_TOKEN_LICITANTE }}
        run: |
          python oraculo_licitante.py
